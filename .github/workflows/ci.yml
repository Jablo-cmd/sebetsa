name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR so pushes don't queue behind
# stale ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        # This build is a quality gate only. The deploy job below performs the
        # real production build with the hosted Supabase configuration.
        run: npm run build

  # No "Edge Function (Deno) tests" job: the three functions it used to
  # check (payments-initiate, payments-webhook, notifications-dispatch)
  # were confirmed orphaned dead code — they referenced payment_intents/
  # payment_gateway_configs/learners/notification_deliveries, none of
  # which exist anywhere in supabase/migrations/ (only in the archived
  # docs/funda360-reference-migrations/ for the predecessor product) — and
  # had no frontend caller (docs/PRODUCTION_READINESS_AUDIT.md). Removed
  # in the same change as this job, rather than left deployed-but-dead.
  # This job also referenced a fourth function, admissions-public, that
  # never existed in this repository at all. Add a new job here if/when a
  # real Edge Function is added.

  rls-tests:
    name: RLS / trigger / SECURITY DEFINER regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # supabase/rls-tests/run.sh spins up its own disposable
      # postgres:16-alpine container with a fixed local-only harness
      # password (see the script) — no repository secrets are used or
      # required for this job.
      - name: Run RLS regression suite
        run: supabase/rls-tests/run.sh

  e2e:
    name: Playwright end-to-end suite
    runs-on: ubuntu-latest
    env:
      # The e2e suite is fully network-mocked and never reaches a real
      # Supabase project. The dev server only needs these variables present.
      VITE_SUPABASE_URL: http://localhost:54321
      VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        run: npx playwright test

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production Supabase configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Missing GitHub Actions secret VITE_SUPABASE_URL in the github-pages environment."
            exit 1
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing GitHub Actions secret VITE_SUPABASE_ANON_KEY in the github-pages environment."
            exit 1
          fi
          case "$VITE_SUPABASE_URL" in
            https://*.supabase.co) ;;
            *)
              echo "::error::VITE_SUPABASE_URL must be the hosted Supabase Project URL (https://<project-ref>.supabase.co)."
              exit 1
              ;;
          esac

      - name: Build production site
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_NAME: Sebetsa
        run: npm run build

      - name: Verify Pages entrypoint
        run: |
          test -f dist/index.html
          # Sebetsa uses BrowserRouter. GitHub Pages needs an SPA fallback
          # so direct visits/refreshes of application routes do not 404.
          cp dist/index.html dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
