<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#12345B" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1F3A" media="(prefers-color-scheme: dark)" />
    <title>Sign In · Sebetsa</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('sebetsa-theme');
          var isDark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {
          /* localStorage unavailable (privacy mode) — default to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
